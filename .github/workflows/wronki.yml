name: Wronki news bot

# Тригери:
#   • workflow_dispatch — ручний запуск і самоланцюжок (кожен прогін ставить наступний
#     через ~1 хв скриптом scripts/dispatch_next.sh);
#   • schedule — СТРАХОВКА. 20.10.2026 ланцюжок тихо помер на 87 год, бо inline curl без
#     --fail проковтнув 401. Розклад GitHub best-effort, але навіть із затримкою він
#     підніме бота і (через dispatch_next.sh) знову запустить ланцюжок.
# Дублікатів не буде: concurrency тримає один прогін, а dispatch_next.sh не ставить
# новий, якщо вже є прогін у черзі/виконанні.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Скинути стан бота (почати з нуля)"
        type: boolean
        default: false
      dry_run:
        description: "Тест без публікації (DRY_RUN=1; стан не зберігається, далі ланцюжок іде звичайними прогонами)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: wronki-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore state (щоб не дублювати)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: botstate3-${{ github.run_id }}
          restore-keys: botstate3-
      - name: Ensure state file
        run: test -f state.json || echo '{"posted":[],"titles":[]}' > state.json
      - name: Reset state (if requested)
        if: ${{ inputs.reset }}
        run: echo '{"posted":[],"titles":[]}' > state.json
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python bot.py
      - name: Save state
        if: always() && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: botstate3-${{ github.run_id }}
      # Самоланцюжок. Ланцюжок живе навіть після падіння бота (always), але крок
      # ПАДАЄ червоним на будь-якій відповіді, крім HTTP 204 (--fail-with-body,
      # 3 спроби, явний код і текст помилки GitHub). Жодного inline curl.
      # Після dry_run ланцюжок теж продовжується (звичайним прогоном): ручний прогін
      # у тій самій concurrency-групі скасовує вже поставлений pending-прогін, тож
      # якби dry_run не продовжував ланцюжок, він би його обривав.
      - name: Schedule next run (self-chain)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          WORKFLOW: wronki.yml
          REF: main
          THIS_RUN_ID: ${{ github.run_id }}
          CHAIN_DELAY_SECONDS: "60"
        run: bash scripts/dispatch_next.sh
